packages:
  - apps/*
  - packages/*
  - services/*
  - tools/*

catalogMode: prefer

catalog:
  "@hono/zod-validator": ^0.9.0
  "@types/node": ^24
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@0.3.0
  vite-plus: 0.3.0
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
allowBuilds:
  esbuild: set this to true or false
