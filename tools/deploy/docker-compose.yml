# Production stack on the HK VPS. Lives at ~/herkules on the box together with
# Caddyfile, caddy/services/*.caddy and the .env (never committed).
#   docker compose pull && docker compose up -d --remove-orphans
# Dev on a laptop: add -f docker-compose.dev.yml (builds locally, http://localhost:3000).
name: herkules

services:
  caddy:
    image: caddy:2.10-alpine
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in .env, e.g. herkules.dev}
      BBS_SITE_ADDRESS: ${BBS_SITE_ADDRESS:?set BBS_SITE_ADDRESS in .env, e.g. bbs.herkules.dev}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/services:/etc/caddy/services:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    depends_on:
      auth:
        condition: service_healthy
      web:
        condition: service_started
      bbs:
        condition: service_started
    mem_limit: 128m
    restart: unless-stopped

  auth:
    image: ${IMAGE_PREFIX:?set IMAGE_PREFIX in .env, e.g. ghcr.io/<owner>/herkules}/auth:${IMAGE_TAG:-latest}
    env_file: .env
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN in .env, e.g. https://herkules.dev}
      DATABASE_URL: postgres://herkules:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/herkules
      TRUSTED_PROXIES: 172.28.0.0/24
      PORT: "3001"
    volumes:
      - avatars:/data/avatars
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 512m
    restart: unless-stopped

  web:
    image: ${IMAGE_PREFIX}/web:${IMAGE_TAG:-latest}
    mem_limit: 64m
    restart: unless-stopped

  # apps/bbs: one image, three commands (apps/bbs/FRAME.md Frame 2).
  # bbs-migrate is a one-shot: applies apps/bbs/drizzle and rederives when corpus_versions differs;
  # both long-running bbs containers wait for it. Re-runs on every `up`.
  bbs-migrate:
    image: ${IMAGE_PREFIX}/bbs:${IMAGE_TAG:-latest}
    command: ["migrate"]
    environment: &bbs-env
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN}
      APP_ORIGIN: ${BBS_ORIGIN:?set BBS_ORIGIN in .env, e.g. https://bbs.herkules.dev}
      AUTH_INTERNAL_URL: http://auth:3001
      DATABASE_URL: postgres://herkules:${POSTGRES_PASSWORD}@postgres:5432/bbs
      BBS_CLIENT_SECRET: ${BBS_CLIENT_SECRET:?set BBS_CLIENT_SECRET in .env}
      BBS_COOKIE_SECRET: ${BBS_COOKIE_SECRET:?set BBS_COOKIE_SECRET in .env}
      WEB_DIR: /app/dist/client
      PORT: "3003"
      NODE_ENV: production
    healthcheck:
      disable: true # the image HEALTHCHECK probes :3003; nothing listens here
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 256m
    restart: "no"

  # API + MCP + SPA. `bbs import` is deprecated but remains the cutover tool:
  # docker compose run --rm bbs import /import/app.db
  bbs:
    image: ${IMAGE_PREFIX}/bbs:${IMAGE_TAG:-latest}
    environment: *bbs-env
    volumes:
      - ./import:/import:ro
    depends_on:
      bbs-migrate:
        condition: service_completed_successfully
      auth:
        condition: service_healthy
    mem_limit: 384m
    restart: unless-stopped

  # The crawler. Scaled to 0 until cutover: `docker compose up -d --scale bbs-worker=1`.
  # Manual check: docker compose run --rm bbs work --once
  # A second worker against the same database exits 3 (advisory lock) before sending any request.
  bbs-worker:
    image: ${IMAGE_PREFIX}/bbs:${IMAGE_TAG:-latest}
    command: ["work"]
    environment: *bbs-env
    healthcheck:
      disable: true # no port; liveness is max(poll_runs.started_at) on /api/status
    depends_on:
      bbs-migrate:
        condition: service_completed_successfully
    deploy:
      replicas: 0
    mem_limit: 256m
    restart: unless-stopped
    stop_grace_period: 30s # SIGTERM aborts sleeps; a fetch in flight (<=15 s) finishes; transactions are atomic

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: herkules
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: herkules
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U herkules -d herkules"]
      interval: 10s
      timeout: 5s
      retries: 6
    mem_limit: 512m
    shm_size: 128m
    restart: unless-stopped

  # Nightly pg_dump to R2 (tools/deploy/backup). Manual run: docker compose run --rm backup backup
  backup:
    image: ${IMAGE_PREFIX}/backup:${IMAGE_TAG:-latest}
    env_file: .env
    environment:
      PGHOST: postgres
      PGUSER: herkules
      PGPASSWORD: ${POSTGRES_PASSWORD}
      DATABASES: herkules bbs
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 128m
    restart: unless-stopped

networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  pgdata:
  avatars:
  caddy_data:
  caddy_config:
