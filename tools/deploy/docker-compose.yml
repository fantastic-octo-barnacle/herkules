# Production stack on the HK VPS. Lives at ~/herkules on the box together with
# Caddyfile, caddy/services/*.caddy and the four env files (never committed):
# .env (compose interpolation), images.env (release-owned image refs), .env.auth,
# .env.bot and .env.backup (per-container secrets).
#   sh compose.sh pull
#   sh compose.sh up -d --remove-orphans
# Dev on a laptop: add -f docker-compose.dev.yml (builds locally, http://localhost:3000).
name: herkules

services:
  # The edge: TLS, routing, and services/web's SPA from /srv. Built by CI (Dockerfile, `caddy`
  # stage) rather than pulled from Docker Hub, because the SPA ships inside it; the Caddyfile
  # itself stays bind-mounted, so routing changes need no rebuild.
  caddy:
    image: ${CADDY_IMAGE_REF:?set CADDY_IMAGE_REF through the active release}
    environment:
      CADDY_TLS_MODE: origin_tls
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in .env, e.g. herkules.dev}
      BBS_SITE_ADDRESS: ${BBS_SITE_ADDRESS:?set BBS_SITE_ADDRESS in .env, e.g. bbs.herkules.dev}
      # Monitoring hosts (gatus / beszel below). Defaults keep the Caddyfile valid in dev.
      STATUS_HOST: ${STATUS_HOST:-status.localhost}
      OPS_HOST: ${OPS_HOST:-ops.localhost}
      LARKSTACK_HOST: ${LARKSTACK_HOST:-lark.localhost}
    volumes:
      - ${DEPLOY_CONFIG_DIR:-.}/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${DEPLOY_CONFIG_DIR:-.}/caddy/services:/etc/caddy/services:ro
      - type: bind
        source: ${ORIGIN_CERT_FILE:-/etc/herkules-tls/origin.pem}
        target: /run/origin-tls/origin.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${ORIGIN_KEY_FILE:-/etc/herkules-tls/origin.key}
        target: /run/origin-tls/origin.key
        read_only: true
        bind:
          create_host_path: false
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    depends_on:
      auth:
        condition: service_healthy
      bbs:
        condition: service_started
    mem_limit: 128m
    restart: unless-stopped

  # env_file is .env.auth, not .env: auth has no business reading the R2 credentials or
  # BBS_COOKIE_SECRET. Compose-level ${VAR} interpolation still comes from .env.
  auth:
    image: ${AUTH_IMAGE_REF:?set AUTH_IMAGE_REF through the active release}
    env_file: .env.auth
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN in .env, e.g. https://herkules.dev}
      DATABASE_URL: postgres://herkules:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/herkules
      TRUSTED_PROXIES: 172.28.0.0/24
      PORT: "3001"
    volumes:
      - avatars:/data/avatars
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 512m
    restart: unless-stopped

  # apps/bbs: one image, three commands (apps/bbs/FRAME.md Frame 2). API + MCP + SPA.
  # It applies apps/bbs/drizzle and rederives derived columns at boot (src/main.ts) before it
  # listens, so the image HEALTHCHECK on :3003 is also the "migrations are in" signal.
  # Trade-off, accepted 2026-08-28: a failed migration now crash-loops `bbs` instead of blocking
  # the rollout with the old container still serving. Run one by hand with
  #   sh compose.sh run --rm bbs migrate
  # `bbs import` is deprecated but remains the cutover tool:
  #   sh compose.sh run --rm bbs import /import/app.db
  bbs:
    image: &bbs-image ${BBS_IMAGE_REF:?set BBS_IMAGE_REF through the active release}
    environment: &bbs-env
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN}
      APP_ORIGIN: ${BBS_ORIGIN:?set BBS_ORIGIN in .env, e.g. https://bbs.herkules.dev}
      AUTH_INTERNAL_URL: http://auth:3001
      DATABASE_URL: postgres://herkules:${POSTGRES_PASSWORD}@postgres:5432/bbs
      BBS_CLIENT_SECRET: ${BBS_CLIENT_SECRET:?set BBS_CLIENT_SECRET in .env}
      BBS_COOKIE_SECRET: ${BBS_COOKIE_SECRET:?set BBS_COOKIE_SECRET in .env}
      WEB_DIR: /app/dist/client
      PORT: "3003"
      NODE_ENV: production
    volumes:
      - ./import:/import:ro
    depends_on:
      postgres:
        condition: service_healthy
      auth:
        condition: service_healthy
    mem_limit: 384m
    restart: unless-stopped

  # The crawler. Scaled to 0 until cutover: `sh compose.sh up -d --scale bbs-worker=1`.
  # Manual check: sh compose.sh run --rm bbs work --once
  # A second worker against the same database exits 3 (advisory lock) before sending any request.
  bbs-worker:
    image: *bbs-image
    command: ["work"]
    environment: *bbs-env
    # No port, so the image HEALTHCHECK on :3003 does not apply; liveness is
    # max(poll_runs.started_at) on /api/status. It cannot simply be disabled either:
    # `compose up --wait` errors with "has no healthcheck configured" for an existing container
    # whose check is disabled (it only tolerates images with none at all). A trivial check keeps
    # --wait meaning "running" for the port-less bbs processes.
    healthcheck: &no-port-healthcheck
      test: ["CMD", "true"]
      interval: 30s
      timeout: 5s
      retries: 1
    depends_on:
      # Healthy means bbs finished migrating: the worker fails fast on a schema it does not know.
      bbs:
        condition: service_healthy
    deploy:
      replicas: 1 # cutover done 2026-08-28; set 0 (or `--scale bbs-worker=0`) to pause crawling
    mem_limit: 256m
    restart: unless-stopped
    stop_grace_period: 30s # SIGTERM aborts sleeps; a fetch in flight (<=15 s) finishes; transactions are atomic

  # Feishu WebSocket bot. The HTTP process migrates first; this process owns no port and holds a
  # dedicated Postgres advisory lock before it connects or sends.
  bbs-bot:
    image: *bbs-image
    command: ["bot"]
    env_file: .env.bot
    environment:
      APP_ORIGIN: ${BBS_ORIGIN}
      DATABASE_URL: postgres://herkules:${POSTGRES_PASSWORD}@postgres:5432/bbs
      NODE_ENV: production
    healthcheck: *no-port-healthcheck # no port either; see bbs-worker
    depends_on:
      bbs:
        condition: service_healthy
    deploy:
      replicas: 1
    mem_limit: 256m
    restart: unless-stopped
    stop_grace_period: 30s

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: herkules
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: herkules
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U herkules -d herkules"]
      interval: 10s
      timeout: 5s
      retries: 6
    mem_limit: 512m
    shm_size: 128m
    restart: unless-stopped

  # AI is enabled only after provisioning secrets/database and setting COMPOSE_PROFILES=ai.
  new-api:
    profiles: [ai]
    image: ${AUTH_IMAGE_REF}
    working_dir: /data
    env_file:
      - path: .env.ai
        required: false
    environment:
      PORT: "3000"
      TZ: Asia/Hong_Kong
      HERKULES_PLANS_ENABLED: "true"
      HERKULES_CLOUD_MODELS: deepseek-flash,deepseek-v4-pro
      MEMORY_CACHE_ENABLED: "false"
      BATCH_UPDATE_ENABLED: "false"
      STREAMING_TIMEOUT: "900"
      ERROR_LOG_ENABLED: "false"
      DEBUG: "false"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      [
        ': "$${SQL_DSN:?SQL_DSN is required}" "$${SESSION_SECRET:?SESSION_SECRET is required}"; exec /new-api',
      ]
    ports: ["127.0.0.1:4014:3000"] # break-glass administration through SSH only
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/status >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 384m
    restart: unless-stopped

  inference:
    profiles: [ai]
    image: ${AUTH_IMAGE_REF}
    command: ["node", "/ai/dist/main.mjs"]
    env_file:
      - path: .env.ai-gateway
        required: false
    environment:
      PORT: "4010" # override PORT=3001 inherited from the auth image
      AI_PORTAL_DIR: /ai/portal
      AI_PORTAL_ORIGIN: https://ai-portal.herkules.dev
      AI_API_ORIGIN: https://ai.herkules.dev
      AUTH_ISSUER: https://herkules.dev/auth
      AUTH_INTERNAL_URL: http://auth:3001/auth
      AI_PLANS_ENABLED: "true"
      AI_WORKERS_FILE: /run/ai/workers.json
      AI_CLIENT_SECRET_FILE: /run/ai/client-secret
      AI_SYNC_SECRET_FILE: /run/ai/sync-secret
      AI_ROOT_PASSWORD_FILE: /run/ai/root-password
      AI_DISPATCH_KEY_FILE: /run/ai/dispatch-key
    volumes:
      - type: bind
        source: /etc/herkules-ai/gateway
        target: /run/ai
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      auth:
        condition: service_healthy
      new-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4010/healthz"]
      interval: 15s
      timeout: 5s
      retries: 4
    mem_limit: 192m
    restart: unless-stopped
    stop_grace_period: 30s

  # larkstack (github.com/fantastic-octo-barnacle/larkstack, a fork of arcboxlabs/larkstack):
  # the GitHub org webhook → Feishu cards, with an admin console at https://${LARKSTACK_HOST}.
  # Off until provisioned (README "larkstack"): the console is open to anyone until a Feishu app
  # is bound under [console], so config.toml is seeded into the volume before the first start.
  # The image comes from the fork's "Herkules image" workflow, pinned here by digest; bump the
  # pin to take a fork sync. Routing rules and the user map live in larkstack_data (SQLite),
  # which the backup service does not cover.
  larkstack:
    profiles: [larkstack]
    image: ghcr.io/fantastic-octo-barnacle/larkstack:sha-a79820c@sha256:b7b3f067a1f7c37517bf7c6bc0d07423c50481ba3eb65f7c3574f18ef2e9dbcb
    env_file:
      - path: .env.larkstack
        required: false
    environment:
      CONSOLE_DATA_DIR: /data
      CONSOLE_PORT: "8080"
      RUST_LOG: info
    volumes:
      - larkstack_data:/data
    mem_limit: 128m
    restart: unless-stopped

  # Nightly pg_dump to R2 (tools/deploy/backup). Manual run: sh compose.sh run --rm backup backup
  # env_file is .env.backup: the R2 credentials live there and nowhere else.
  backup:
    image: ${BACKUP_IMAGE_REF:?set BACKUP_IMAGE_REF through the active release}
    env_file: .env.backup
    environment:
      PGHOST: postgres
      PGUSER: herkules
      PGPASSWORD: ${POSTGRES_PASSWORD}
      DATABASES: herkules bbs ${AI_BACKUP_DATABASE:-}
      # After a successful upload backup.sh pushes to Gatus's "Backups" external endpoint
      # (gatus.yaml); the row stays red until the first push. Same token as GATUS_BACKUP_TOKEN there.
      GATUS_URL: http://gatus:8080
      GATUS_BACKUP_TOKEN: ${GATUS_BACKUP_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 128m
    restart: unless-stopped

  # ── monitoring (tools/deploy/README.md "Monitoring") ───────────────────────────
  # Public status page: eight checks in gatus.yaml, sqlite history, no auth (the page says
  # nothing a curl could not). Reached only as https://${STATUS_HOST} through caddy.
  gatus:
    image: ghcr.io/twin/gatus:v5.36.0
    volumes:
      - ${DEPLOY_CONFIG_DIR:-.}/gatus.yaml:/config/config.yaml:ro
      - gatus_data:/data
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
      BBS_SITE_ADDRESS: ${BBS_SITE_ADDRESS}
      OPS_HOST: ${OPS_HOST:-ops.localhost}
      GATUS_BACKUP_TOKEN: ${GATUS_BACKUP_TOKEN:-}
    mem_limit: 96m
    restart: unless-stopped

  # Beszel hub: host/container metrics for this box and every team machine (agents dial in
  # over WebSocket at https://${OPS_HOST}). Sign-in is the herkules auth service (OIDC client
  # `beszel`, services/auth); password login is off, PocketBase's /_/ UI is blocked at caddy.
  beszel:
    image: henrygd/beszel:0.18.8
    volumes:
      - beszel_data:/beszel_data
      - beszel_socket:/beszel_socket
    environment:
      APP_URL: https://${OPS_HOST:-ops.localhost}
      # Full-page OIDC redirect. Beszel 0.18.8 supports this without requiring browser popups.
      OAUTH_DISABLE_POPUP: "true"
      USER_CREATION: "true" # every org member who signs in through OIDC gets an account (role `user`; flip to readonly)
      DISABLE_PASSWORD_AUTH: "true"
      SHARE_ALL_SYSTEMS: "true"
      HEARTBEAT_URL: ${BESZEL_HEARTBEAT_URL:-} # optional dead-man ping (Better Stack heartbeat)
    mem_limit: 192m
    restart: unless-stopped

  # This box's own agent. Host network for interface stats; the hub reaches it over the shared
  # unix socket, so no port is opened. KEY = the hub's public key (README "Monitoring").
  beszel-agent:
    image: henrygd/beszel-agent:0.18.8
    network_mode: host
    volumes:
      - beszel_agent_data:/var/lib/beszel-agent
      - beszel_socket:/beszel_socket
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      LISTEN: /beszel_socket/beszel.sock
      KEY: ${BESZEL_KEY:-}
    mem_limit: 64m
    restart: unless-stopped

networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  pgdata:
  avatars:
  caddy_data:
  caddy_config:
  gatus_data:
  beszel_data:
  beszel_socket:
  beszel_agent_data:
  larkstack_data:
