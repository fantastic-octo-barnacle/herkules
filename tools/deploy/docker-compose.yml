# Production stack on the HK VPS. Lives at ~/herkules on the box together with
# Caddyfile, caddy/services/*.caddy and the three env files (never committed):
# .env (compose interpolation), .env.auth and .env.backup (per-container secrets).
#   docker compose pull && docker compose up -d --remove-orphans
# Dev on a laptop: add -f docker-compose.dev.yml (builds locally, http://localhost:3000).
name: herkules

services:
  # The edge: TLS, routing, and services/web's SPA from /srv. Built by CI (Dockerfile, `caddy`
  # stage) rather than pulled from Docker Hub, because the SPA ships inside it; the Caddyfile
  # itself stays bind-mounted, so routing changes need no rebuild.
  caddy:
    image: ${IMAGE_PREFIX:?set IMAGE_PREFIX in .env, e.g. ghcr.io/<owner>/herkules}/caddy:${IMAGE_TAG:-latest}
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in .env, e.g. herkules.dev}
      BBS_SITE_ADDRESS: ${BBS_SITE_ADDRESS:?set BBS_SITE_ADDRESS in .env, e.g. bbs.herkules.dev}
      # Monitoring hosts (gatus / beszel below). Defaults keep the Caddyfile valid in dev.
      STATUS_HOST: ${STATUS_HOST:-status.localhost}
      OPS_HOST: ${OPS_HOST:-ops.localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/services:/etc/caddy/services:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    depends_on:
      auth:
        condition: service_healthy
      bbs:
        condition: service_started
    mem_limit: 128m
    restart: unless-stopped

  # env_file is .env.auth, not .env: auth has no business reading the R2 credentials or
  # BBS_COOKIE_SECRET. Compose-level ${VAR} interpolation still comes from .env.
  auth:
    image: ${IMAGE_PREFIX}/auth:${IMAGE_TAG:-latest}
    env_file: .env.auth
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN in .env, e.g. https://herkules.dev}
      DATABASE_URL: postgres://herkules:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/herkules
      TRUSTED_PROXIES: 172.28.0.0/24
      PORT: "3001"
    volumes:
      - avatars:/data/avatars
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 512m
    restart: unless-stopped

  # apps/bbs: one image, three commands (apps/bbs/FRAME.md Frame 2). API + MCP + SPA.
  # It applies apps/bbs/drizzle and rederives derived columns at boot (src/main.ts) before it
  # listens, so the image HEALTHCHECK on :3003 is also the "migrations are in" signal.
  # Trade-off, accepted 2026-08-28: a failed migration now crash-loops `bbs` instead of blocking
  # the rollout with the old container still serving. Run one by hand with
  #   docker compose run --rm bbs migrate
  # `bbs import` is deprecated but remains the cutover tool:
  #   docker compose run --rm bbs import /import/app.db
  bbs:
    image: ${IMAGE_PREFIX}/bbs:${IMAGE_TAG:-latest}
    environment: &bbs-env
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN}
      APP_ORIGIN: ${BBS_ORIGIN:?set BBS_ORIGIN in .env, e.g. https://bbs.herkules.dev}
      AUTH_INTERNAL_URL: http://auth:3001
      DATABASE_URL: postgres://herkules:${POSTGRES_PASSWORD}@postgres:5432/bbs
      BBS_CLIENT_SECRET: ${BBS_CLIENT_SECRET:?set BBS_CLIENT_SECRET in .env}
      BBS_COOKIE_SECRET: ${BBS_COOKIE_SECRET:?set BBS_COOKIE_SECRET in .env}
      WEB_DIR: /app/dist/client
      PORT: "3003"
      NODE_ENV: production
    volumes:
      - ./import:/import:ro
    depends_on:
      postgres:
        condition: service_healthy
      auth:
        condition: service_healthy
    mem_limit: 384m
    restart: unless-stopped

  # The crawler. Scaled to 0 until cutover: `docker compose up -d --scale bbs-worker=1`.
  # Manual check: docker compose run --rm bbs work --once
  # A second worker against the same database exits 3 (advisory lock) before sending any request.
  bbs-worker:
    image: ${IMAGE_PREFIX}/bbs:${IMAGE_TAG:-latest}
    command: ["work"]
    environment: *bbs-env
    healthcheck:
      disable: true # no port; liveness is max(poll_runs.started_at) on /api/status
    depends_on:
      # Healthy means bbs finished migrating: the worker fails fast on a schema it does not know.
      bbs:
        condition: service_healthy
    deploy:
      replicas: 1 # cutover done 2026-08-28; set 0 (or `--scale bbs-worker=0`) to pause crawling
    mem_limit: 256m
    restart: unless-stopped
    stop_grace_period: 30s # SIGTERM aborts sleeps; a fetch in flight (<=15 s) finishes; transactions are atomic

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: herkules
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: herkules
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U herkules -d herkules"]
      interval: 10s
      timeout: 5s
      retries: 6
    mem_limit: 512m
    shm_size: 128m
    restart: unless-stopped

  # Nightly pg_dump to R2 (tools/deploy/backup). Manual run: docker compose run --rm backup backup
  # env_file is .env.backup: the R2 credentials live there and nowhere else.
  backup:
    image: ${IMAGE_PREFIX}/backup:${IMAGE_TAG:-latest}
    env_file: .env.backup
    environment:
      PGHOST: postgres
      PGUSER: herkules
      PGPASSWORD: ${POSTGRES_PASSWORD}
      DATABASES: herkules bbs
      # After a successful upload backup.sh pushes to Gatus's "Backups" external endpoint
      # (gatus.yaml); the row stays red until the first push. Same token as GATUS_BACKUP_TOKEN there.
      GATUS_URL: http://gatus:8080
      GATUS_BACKUP_TOKEN: ${GATUS_BACKUP_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 128m
    restart: unless-stopped

  # ── monitoring (tools/deploy/README.md "Monitoring") ───────────────────────────
  # Public status page: eight checks in gatus.yaml, sqlite history, no auth (the page says
  # nothing a curl could not). Reached only as https://${STATUS_HOST} through caddy.
  gatus:
    image: ghcr.io/twin/gatus:v5.36.0
    volumes:
      - ./gatus.yaml:/config/config.yaml:ro
      - gatus_data:/data
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
      BBS_SITE_ADDRESS: ${BBS_SITE_ADDRESS}
      OPS_HOST: ${OPS_HOST:-ops.localhost}
      GATUS_BACKUP_TOKEN: ${GATUS_BACKUP_TOKEN:-}
    mem_limit: 96m
    restart: unless-stopped

  # Beszel hub: host/container metrics for this box and every team machine (agents dial in
  # over WebSocket at https://${OPS_HOST}). Sign-in is the herkules auth service (OIDC client
  # `beszel`, services/auth); password login is off, PocketBase's /_/ UI is blocked at caddy.
  beszel:
    image: henrygd/beszel:0.18.8
    volumes:
      - beszel_data:/beszel_data
      - beszel_socket:/beszel_socket
    environment:
      APP_URL: https://${OPS_HOST:-ops.localhost}
      USER_CREATION: "true" # every org member who signs in through OIDC gets an account (role `user`; flip to readonly)
      DISABLE_PASSWORD_AUTH: "true"
      SHARE_ALL_SYSTEMS: "true"
      HEARTBEAT_URL: ${BESZEL_HEARTBEAT_URL:-} # optional dead-man ping (Better Stack heartbeat)
    mem_limit: 192m
    restart: unless-stopped

  # This box's own agent. Host network for interface stats; the hub reaches it over the shared
  # unix socket, so no port is opened. KEY = the hub's public key (README "Monitoring").
  beszel-agent:
    image: henrygd/beszel-agent:0.18.8
    network_mode: host
    volumes:
      - beszel_agent_data:/var/lib/beszel-agent
      - beszel_socket:/beszel_socket
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      LISTEN: /beszel_socket/beszel.sock
      KEY: ${BESZEL_KEY:-}
    mem_limit: 64m
    restart: unless-stopped

networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  pgdata:
  avatars:
  caddy_data:
  caddy_config:
  gatus_data:
  beszel_data:
  beszel_socket:
  beszel_agent_data:
