# Laptop overlay: build the images from this checkout, serve http://localhost:3000, no backup job.
#   .env.example documents the three files the stack needs: .env, .env.auth, .env.backup.
#   .env.backup can stay empty here — the backup service is scaled to 0.
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
services:
  caddy:
    environment:
      CADDY_TLS_MODE: local_http
      STATUS_HOST: http://status.localhost
      OPS_HOST: http://ops.localhost
      AI_HOST: http://ai.localhost
      AI_PORTAL_HOST: http://ai-portal.localhost
    volumes: !override
      - ${DEPLOY_CONFIG_DIR:-.}/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${DEPLOY_CONFIG_DIR:-.}/caddy/services:/etc/caddy/services:ro
      - caddy_data:/data
      - caddy_config:/config
    build:
      context: ../..
      target: caddy
    ports: !override
      - "3000:3000"
      - "3003:3003"
  auth:
    build:
      context: ../..
      target: auth
  new-api:
    build:
      context: ../..
      target: ai
  inference:
    build:
      context: ../..
      target: ai
  bbs:
    build:
      context: ../..
      target: bbs
  bbs-bot:
    build:
      context: ../..
      target: bbs
    deploy:
      replicas: 0
  backup:
    build:
      context: ../..
      target: backup
    deploy:
      replicas: 0
