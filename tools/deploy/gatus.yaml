# Gatus: the public status page at https://${STATUS_HOST} (tools/deploy/README.md "Monitoring").
# Mounted read-only at /config/config.yaml from the active release, so an edit is a push: the
# applicator recreates gatus whenever this file's digest changes. Do not edit it on the box.
# ${SITE_ADDRESS}, ${BBS_SITE_ADDRESS}, ${OPS_HOST}, ${GATUS_BACKUP_TOKEN} come from the
# container environment (compose interpolates them from .env).
#
# Eight rows, one per thing somebody would act on (FRAME "Monitoring", Q14). The page is
# public and has no `security:` block, so every check touches a public URL only and says
# nothing about the host or the compose network. No alerting yet (Q7).

web:
  port: 8080

storage:
  type: sqlite
  path: /data/gatus.db
  maximum-number-of-results: 200
  maximum-number-of-events: 50

ui:
  title: "herkules status"
  header: "herkules"
  dashboard-heading: "Service status"
  dashboard-subheading: "Checked every minute from the server in Hong Kong"
  link: "https://${SITE_ADDRESS}"
  buttons:
    - name: "RM 文库"
      link: "https://${BBS_SITE_ADDRESS}"

endpoints:
  # 1. The platform site: TLS, the edge Caddy, the SPA. Also the certificate for every host.
  - name: Site
    group: platform
    url: "https://${SITE_ADDRESS}/"
    interval: 1m
    conditions:
      - "[STATUS] == 200"
      - "[RESPONSE_TIME] < 1500"
      - "[CERTIFICATE_EXPIRATION] > 168h"

  # 2. Sign-in: a real answer from the authorization server, not a healthz.
  - name: Sign-in
    group: platform
    url: "https://${SITE_ADDRESS}/.well-known/oauth-authorization-server/auth"
    interval: 1m
    conditions:
      - "[STATUS] == 200"
      - "[BODY].issuer == https://${SITE_ADDRESS}/auth"

  # 3. The RM 文库 process is up and serving its origin.
  - name: Web
    group: RM 文库
    url: "https://${BBS_SITE_ADDRESS}/healthz"
    interval: 1m
    conditions:
      - "[STATUS] == 200"

  # 4. API + database: the status query touches every corpus table.
  - name: API & database
    group: RM 文库
    url: "https://${BBS_SITE_ADDRESS}/api/status"
    interval: 1m
    conditions:
      - "[STATUS] == 200"
      - "[BODY].articles.total > 0"
      - "[RESPONSE_TIME] < 2000"

  # 5. Crawler liveness: the worker polls every 10 min; 30 min without a poll_runs row is a stall.
  - name: Crawler
    group: RM 文库
    url: "https://${BBS_SITE_ADDRESS}/api/status"
    interval: 1m
    conditions:
      - "[STATUS] == 200"
      - "[BODY].crawler.lastCheckedAgeSeconds < 1800"

  # 6. MCP: the resource refuses an unauthenticated initialize the RFC 9728 way (401 +
  # WWW-Authenticate resource_metadata, JSON-RPC error body), which proves the MCP surface
  # and the auth wiring without holding a token. Gatus cannot match on the header value, so
  # the body carries the assertion.
  - name: MCP
    group: RM 文库
    url: "https://${SITE_ADDRESS}/mcp/bbs"
    method: POST
    headers:
      Content-Type: application/json
      Accept: application/json, text/event-stream
    body: '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"gatus","version":"1"}}}'
    interval: 1m
    conditions:
      - "[STATUS] == 401"
      - "[BODY].error.message == missing bearer token"

  # 8. The Beszel hub answers (its sign-in is the auth service; this only proves the process).
  - name: Monitoring
    group: platform
    url: "https://${OPS_HOST}/"
    interval: 1m
    conditions:
      - "[STATUS] == 200"

# 7. Backups: tools/deploy/backup/backup.sh POSTs here after every successful upload
# (key = <group>_<name> lowercased, spaces to dashes: `platform_backups`). More than 26 h
# of silence turns the row red — the nightly job (03:00 Hong Kong, 19:00 UTC) missed a night.
external-endpoints:
  - name: Backups
    group: platform
    token: "${GATUS_BACKUP_TOKEN}"
    heartbeat:
      interval: 26h
