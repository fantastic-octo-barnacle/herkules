name: herkules-ai-dev
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: devadmin
      POSTGRES_PASSWORD: ${AI_DEV_DB_PASSWORD:?run the local setup first}
    ports: ["127.0.0.1:15433:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ${AI_DEV_DIR}/init.sql:/docker-entrypoint-initdb.d/ai.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devadmin"]
      interval: 2s
      timeout: 3s
      retries: 30
  new-api:
    image: calciumion/new-api:v1.0.0-rc.37@sha256:8b6cf781e479e6dfcaa5f1ddd86f0e20f12352980029d0d0dfb35cf8cbd1792b
    environment:
      SQL_DSN: postgres://herkules_ai:${AI_DEV_DB_PASSWORD}@postgres:5432/herkules_ai
      SESSION_SECRET: ${AI_DEV_SESSION_SECRET}
      MEMORY_CACHE_ENABLED: "false"
      BATCH_UPDATE_ENABLED: "false"
      STREAMING_TIMEOUT: "900"
      ERROR_LOG_ENABLED: "false"
      DEBUG: "false"
      CRITICAL_RATE_LIMIT: "200" # isolated test stack repeatedly signs in fixtures
    ports: ["127.0.0.1:4014:3000"]
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts: ["host.docker.internal:host-gateway"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/status >/dev/null"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  pgdata:
