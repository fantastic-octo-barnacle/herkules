name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
# Superseded PR checks can stop; main CI must finish to trigger image releases.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  ready:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@v1
        with:
          cache: true
          run-install: true
      # check + every package's tests (PGlite, fake GitHub: no services) + every build.
      - run: vp run ready
      - run: vp run build:edge
      - run: vp run test:edge
      - run: node --test tools/deploy/cloudflare/release.test.mjs
      - run: vp exec wrangler deploy --dry-run --config tools/deploy/cloudflare/platform.json
      - run: vp exec wrangler deploy --dry-run --config tools/deploy/cloudflare/bbs-assets.json
      - run: vp run test:caddy

  new-api:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      # Keep this check present on every PR, but build only when its inputs change.
      - name: Detect New API build inputs
        id: inputs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- Dockerfile .dockerignore .github/workflows/ci.yml tools/ai/new-api tools/ai/portal > new-api-paths
            if [[ -s new-api-paths ]]; then
              echo "build=true" >> "$GITHUB_OUTPUT"
            else
              echo "build=false" >> "$GITHUB_OUTPUT"
            fi
            rm new-api-paths
          fi
      - uses: docker/setup-buildx-action@v4
        if: steps.inputs.outputs.build == 'true'
      - uses: docker/build-push-action@v7
        if: steps.inputs.outputs.build == 'true'
        with:
          context: .
          target: ai-backend
          push: false
          cache-from: type=gha,scope=ai-backend
          cache-to: type=gha,scope=ai-backend,mode=max

  # Credential-free checks on the DNS-as-code config. Format, schema validation,
  # and the invariants in tests/ under a mocked provider; nothing talks to
  # Cloudflare. Plans and applies live in terraform.yml behind TERRAFORM_ENABLED.
  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TERRAFORM_DIR: tools/deploy/cloudflare/terraform
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dflook/terraform-fmt-check@v3
        with:
          path: ${{ env.TERRAFORM_DIR }}
      - uses: dflook/terraform-validate@v3
        with:
          path: ${{ env.TERRAFORM_DIR }}
      - uses: dflook/terraform-test@v3
        with:
          path: ${{ env.TERRAFORM_DIR }}
      # Worker uploads and routes belong to release.mjs; two tools must never own
      # the same resource. Permanent boundary, see tools/deploy/cloudflare/README.md.
      - name: Worker resources stay out of Terraform
        run: |
          if grep -rn 'cloudflare_workers_' "$TERRAFORM_DIR" --include='*.tf'; then
            echo "::error::Worker resources are owned by release.mjs, not Terraform."
            exit 1
          fi
