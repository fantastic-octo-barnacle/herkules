name: CI
on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
# Superseded PR checks can stop; main CI must finish to trigger image releases.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  images:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      actions: read
      contents: read
      packages: write
    uses: ./.github/workflows/image-build.yml

  manifest:
    needs: [images, ready, new-api]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: image-updates
          path: image-updates
      - name: Assemble tested application manifest
        env:
          BUILD_SHA: ${{ github.sha }}
        run: |
          jq -s --arg source "$BUILD_SHA" --arg repository "$GITHUB_REPOSITORY" \
            '{schemaVersion: 1, repository: $repository, sourceSha: $source,
              images: (map({key: .target, value: .image}) | from_entries)}' \
            image-updates/*.json > application.json
      - uses: actions/upload-artifact@v7
        with:
          name: application
          path: application.json
          if-no-files-found: error

  ready:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@v1
        with:
          cache: true
          run-install: true
      # check + every package's tests (PGlite, fake GitHub: no services) + every build.
      - run: vp run ready
      - run: sh tools/images/caddy.test.sh

  new-api:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      # Keep this check present on every PR, but build only when its inputs change.
      - name: Detect New API build inputs
        id: inputs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- Dockerfile .dockerignore .github/workflows/ci.yml tools/ai/new-api tools/ai/portal > new-api-paths
            if [[ -s new-api-paths ]]; then
              echo "build=true" >> "$GITHUB_OUTPUT"
            else
              echo "build=false" >> "$GITHUB_OUTPUT"
            fi
            rm new-api-paths
          fi
      - uses: docker/setup-buildx-action@v4
        if: steps.inputs.outputs.build == 'true'
      - uses: docker/build-push-action@v7
        if: steps.inputs.outputs.build == 'true'
        with:
          context: .
          target: ai-backend
          push: false
          cache-from: type=gha,scope=ai-backend
          cache-to: type=gha,scope=ai-backend,mode=max
