name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  ready:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@v1
        with:
          cache: true
          run-install: true
      # check + every package's tests (PGlite, fake GitHub: no services) + every build.
      - run: vp run ready
      - run: vp run test:caddy
