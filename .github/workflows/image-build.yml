name: Image build

# Called by ci.yml (push to main, in parallel with CI's checks) and by images.yml (manual run).
# Selects the image inputs that changed since the source of the active production release and
# builds them as one BuildKit graph. Pushing an image deploys nothing: release.yml runs only
# after CI passes, and it decides which of these digests enter a release.
on:
  workflow_call:
    outputs:
      targets:
        description: JSON array of the image targets this run built
        value: ${{ jobs.changes.outputs.targets }}
      deploy:
        description: Whether this commit needs a release
        value: ${{ jobs.changes.outputs.deploy }}

permissions:
  contents: read

env:
  BUILD_SHA: ${{ github.sha }}

jobs:
  changes:
    permissions:
      contents: read
      deployments: read
    timeout-minutes: 10
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.select.outputs.targets }}
      deploy: ${{ steps.select.outputs.deploy }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.BUILD_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - id: select
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          active=$(bash tools/deploy/deployment-state.sh active)
          active_source=$(jq -r '.sourceSha // ""' <<<"$active")
          if [[ "$GITHUB_EVENT_NAME" == "push" && -n "$active_source" ]] \
            && git cat-file -e "$active_source^{commit}" 2>/dev/null; then
            selection=$(git diff --name-only "$active_source" "$BUILD_SHA" | node tools/deploy/image-targets.mjs)
          else
            selection=$(node tools/deploy/image-targets.mjs --all)
          fi
          echo "targets=$(jq -c '.targets' <<<"$selection")" >> "$GITHUB_OUTPUT"
          echo "deploy=$(jq -r '.deploy' <<<"$selection")" >> "$GITHUB_OUTPUT"
          echo "$selection"

  build:
    permissions:
      actions: read
      contents: read
      packages: write
    timeout-minutes: 45
    needs: changes
    if: needs.changes.outputs.targets != '[]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.BUILD_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - id: rev
        env:
          TARGETS: ${{ needs.changes.outputs.targets }}
        run: |
          echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          echo "bake=$(jq -r 'join(",")' <<<"$TARGETS")" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Labels only; tags come from tools/deploy/docker-bake.hcl.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
      # One job, one graph: the selected targets share the build and AI stages.
      - id: bake
        uses: docker/bake-action@v7
        env:
          REPOSITORY: ${{ github.repository }}
          SHORT_SHA: ${{ steps.rev.outputs.short }}
        with:
          source: .
          files: |
            tools/deploy/docker-bake.hcl
            ${{ steps.meta.outputs.bake-file-labels }}
          targets: ${{ steps.rev.outputs.bake }}
          push: true
      - name: Record immutable image references
        env:
          METADATA: ${{ steps.bake.outputs.metadata }}
          SHORT_SHA: ${{ steps.rev.outputs.short }}
          TARGETS: ${{ needs.changes.outputs.targets }}
        run: |
          mkdir -p image-update
          for target in $(jq -r '.[]' <<<"$TARGETS"); do
            digest=$(jq -r --arg target "$target" '.[$target]["containerimage.digest"] // ""' <<<"$METADATA")
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "bake reported no digest for $target" >&2
              exit 1
            fi
            jq -n \
              --arg target "$target" \
              --arg image "ghcr.io/$GITHUB_REPOSITORY/$target:sha-$SHORT_SHA@$digest" \
              '{target: $target, image: $image}' > "image-update/$target.json"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: image-updates
          path: image-update/*.json
          if-no-files-found: error
