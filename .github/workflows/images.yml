name: Images

# Publish application artifacts only. Production selection and deployment live in herkules-infra.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
env:
  BUILD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
jobs:
  build:
    permissions:
      actions: read
      contents: read
      packages: write
    timeout-minutes: 45
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [auth, bbs, platform]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.BUILD_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - id: rev
        run: echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.target }}
          tags: |
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_run' || github.ref == 'refs/heads/main' }}
            type=raw,value=sha-${{ env.BUILD_SHA }}
      - id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=auth
            type=gha,scope=bbs
            type=gha,scope=platform
            type=gha,scope=ai-backend
          cache-to: |
            type=gha,scope=${{ matrix.target }},mode=max
      - name: Record immutable image reference
        env:
          TARGET: ${{ matrix.target }}
          SOURCE_SHA: ${{ env.BUILD_SHA }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          mkdir -p image-update
          jq -n \
            --arg target "$TARGET" \
            --arg image "ghcr.io/$GITHUB_REPOSITORY/$TARGET:sha-$SOURCE_SHA@$DIGEST" \
            '{target: $target, image: $image}' > "image-update/$TARGET.json"
      - uses: actions/upload-artifact@v7
        with:
          name: image-${{ matrix.target }}
          path: image-update/${{ matrix.target }}.json
          if-no-files-found: error

  manifest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: image-*
          path: image-updates
          merge-multiple: true
      - name: Assemble application manifest
        run: |
          jq -s --arg source "$BUILD_SHA" --arg repository "$GITHUB_REPOSITORY" \
            '{schemaVersion: 1, repository: $repository, sourceSha: $source,
              images: (map({key: .target, value: .image}) | from_entries)}' \
            image-updates/*.json > application.json
      - uses: actions/upload-artifact@v7
        with:
          name: application
          path: application.json
          if-no-files-found: error
