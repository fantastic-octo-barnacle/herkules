name: Images

# Manual full release: rebuild all four images from main and release them. Pushes to main are
# built and released by ci.yml, which gates the release on its own checks.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  images:
    if: github.ref == 'refs/heads/main'
    permissions:
      actions: read
      contents: read
      deployments: read
      packages: write
    uses: ./.github/workflows/image-build.yml

  release:
    needs: images
    if: needs.images.outputs.deploy == 'true'
    permissions:
      actions: read
      contents: read
      deployments: write
      packages: write
    uses: ./.github/workflows/release.yml
    with:
      targets: ${{ needs.images.outputs.targets }}
    secrets: inherit
