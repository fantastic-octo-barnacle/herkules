name: Images

# CI selects and builds image inputs changed since the last attempted release cursor. The
# serialized release job then patches those digests into the active production image tuple,
# publishes a complete OCI release bundle, and applies that exact bundle over SSH.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  deployments: write
  packages: write

env:
  BUILD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
  CI_RUN_NUMBER: ${{ github.event.workflow_run.run_number || 0 }}
  RELEASE_REPOSITORY: ghcr.io/${{ github.repository }}/release

jobs:
  changes:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.select.outputs.targets }}
      deploy: ${{ steps.select.outputs.deploy }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.BUILD_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - id: select
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          active=$(bash tools/deploy/deployment-state.sh active)
          active_release=$(jq -r '.release // ""' <<<"$active")
          attempted=$(bash tools/deploy/deployment-state.sh cursor)
          cursor=$(jq -r '.ciCursor // 0' <<<"$attempted")
          if [[ -z "$active_release" || "$GITHUB_EVENT_NAME" != "workflow_run" ]]; then
            selection=$(node tools/deploy/image-targets.mjs --all)
          else
            previous=$(gh api \
              "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&status=success&per_page=100" \
              --jq ".workflow_runs | map(select(.run_number == $cursor)) | first | .head_sha // \"\"")
            if [[ -z "$previous" ]]; then
              selection=$(node tools/deploy/image-targets.mjs --all)
            else
              selection=$(git diff --name-only "$previous" "$BUILD_SHA" | node tools/deploy/image-targets.mjs)
            fi
          fi
          echo "targets=$(jq -c '.targets' <<<"$selection")" >> "$GITHUB_OUTPUT"
          echo "deploy=$(jq -r '.deploy' <<<"$selection")" >> "$GITHUB_OUTPUT"
          echo "$selection"

  build:
    needs: changes
    if: needs.changes.outputs.targets != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: ${{ fromJSON(needs.changes.outputs.targets) }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.BUILD_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - id: rev
        run: echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.target }}
          tags: |
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_run' || github.ref == 'refs/heads/main' }}
            type=raw,value=sha-${{ steps.rev.outputs.short }}
      - id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=build
            type=gha,scope=${{ matrix.target }}
          cache-to: |
            type=gha,scope=build,mode=max
            type=gha,scope=${{ matrix.target }},mode=max
      - name: Record immutable image reference
        env:
          TARGET: ${{ matrix.target }}
          SHORT_SHA: ${{ steps.rev.outputs.short }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          mkdir -p image-update
          jq -n \
            --arg target "$TARGET" \
            --arg image "ghcr.io/$GITHUB_REPOSITORY/$TARGET:sha-$SHORT_SHA@$DIGEST" \
            '{target: $target, image: $image}' > "image-update/$TARGET.json"
      - uses: actions/upload-artifact@v7
        with:
          name: image-${{ matrix.target }}
          path: image-update/${{ matrix.target }}.json
          if-no-files-found: error

  release:
    needs: [changes, build]
    if: >-
      always() &&
      needs.changes.outputs.deploy == 'true' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://herkules.dev
    concurrency: deploy-production
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.BUILD_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v8
        if: needs.changes.outputs.targets != '[]'
        with:
          pattern: image-*
          path: image-updates
          merge-multiple: true
      - uses: oras-project/setup-oras@v1
        with:
          version: 1.3.0
      - name: Log in to the release registry
        run: printf '%s' "$GH_TOKEN" | oras login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve active production release
        id: active
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          state=$(bash tools/deploy/deployment-state.sh active)
          attempted=$(bash tools/deploy/deployment-state.sh cursor)
          release=$(jq -r '.release // ""' <<<"$state")
          source=$(jq -r '.sourceSha // ""' <<<"$state")
          cursor=$(jq -r '.ciCursor // 0' <<<"$state")
          attempted_cursor=$(jq -r '.ciCursor // 0' <<<"$attempted")
          stale=false
          if [[ "$GITHUB_EVENT_NAME" == "workflow_run" && "$attempted_cursor" -gt "$CI_RUN_NUMBER" ]]; then
            stale=true
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "source=$source" >> "$GITHUB_OUTPUT"
          echo "cursor=$cursor" >> "$GITHUB_OUTPUT"
          echo "attempted_cursor=$attempted_cursor" >> "$GITHUB_OUTPUT"
          echo "stale=$stale" >> "$GITHUB_OUTPUT"
      - name: Pull active release bundle
        if: steps.active.outputs.stale != 'true' && steps.active.outputs.release != ''
        env:
          ACTIVE_RELEASE: ${{ steps.active.outputs.release }}
        run: |
          mkdir -p active-artifact active-release
          oras pull "$ACTIVE_RELEASE" --output active-artifact
          tar -xzf active-artifact/release.tar.gz -C active-release
          node tools/deploy/release.mjs verify \
            --release active-release/release.json \
            --bundle active-release
      - name: Assemble and publish release
        id: candidate
        if: steps.active.outputs.stale != 'true'
        env:
          ACTIVE_RELEASE: ${{ steps.active.outputs.release }}
          ATTEMPTED_CURSOR: ${{ steps.active.outputs.attempted_cursor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p bundle/caddy candidate-updates image-updates

          if [[ "$GITHUB_EVENT_NAME" == "workflow_run" && "$ATTEMPTED_CURSOR" -gt 0 ]]; then
            base=$(gh api \
              "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&status=success&per_page=100" \
              --jq ".workflow_runs | map(select(.run_number == $ATTEMPTED_CURSOR)) | first | .head_sha // \"\"")
            if [[ -z "$base" ]]; then
              selected=$(node tools/deploy/image-targets.mjs --all)
              selection_all=true
              : > release-paths
            else
              git diff --name-only "$base" "$BUILD_SHA" > release-paths
              selected=$(node tools/deploy/image-targets.mjs < release-paths)
              selection_all=false
            fi
          else
            selected=$(node tools/deploy/image-targets.mjs --all)
            selection_all=true
            : > release-paths
          fi

          if [[ -n "$ACTIVE_RELEASE" ]]; then
            cp active-release/docker-compose.yml bundle/docker-compose.yml
            cp active-release/Caddyfile bundle/Caddyfile
            cp active-release/gatus.yaml bundle/gatus.yaml
            cp active-release/apply-release.sh bundle/apply-release.sh
            cp active-release/compose.sh bundle/compose.sh
            cp -R active-release/caddy/services bundle/caddy/services
          else
            cp tools/deploy/docker-compose.yml bundle/docker-compose.yml
            cp tools/deploy/Caddyfile bundle/Caddyfile
            cp tools/deploy/gatus.yaml bundle/gatus.yaml
            cp tools/deploy/apply-release.sh bundle/apply-release.sh
            cp tools/deploy/compose.sh bundle/compose.sh
            cp -R tools/deploy/caddy/services bundle/caddy/services
          fi
          if [[ "$selection_all" == "true" || -z "$ACTIVE_RELEASE" ]]; then
            refresh_all=true
          else
            refresh_all=false
          fi
          if [[ "$refresh_all" == "true" ]] || grep -qx 'tools/deploy/docker-compose.yml' release-paths; then
            cp tools/deploy/docker-compose.yml bundle/docker-compose.yml
          fi
          if [[ "$refresh_all" == "true" ]] || grep -Eq '^tools/deploy/(Caddyfile|caddy/services/)' release-paths; then
            cp tools/deploy/Caddyfile bundle/Caddyfile
            rm -rf bundle/caddy/services
            cp -R tools/deploy/caddy/services bundle/caddy/services
          fi
          if [[ "$refresh_all" == "true" ]] || grep -qx 'tools/deploy/gatus.yaml' release-paths; then
            cp tools/deploy/gatus.yaml bundle/gatus.yaml
          fi
          if [[ "$refresh_all" == "true" ]] || grep -Eq '^tools/deploy/(apply-release|compose)\.sh$' release-paths; then
            cp tools/deploy/apply-release.sh bundle/apply-release.sh
            cp tools/deploy/compose.sh bundle/compose.sh
          fi
          for update in image-updates/*.json; do
            [[ -f "$update" ]] || continue
            target=$(jq -r '.target' "$update")
            if jq -e --arg target "$target" '.targets | index($target) != null' <<<"$selected" >/dev/null; then
              cp "$update" candidate-updates/
            fi
          done

          create=(node tools/deploy/release.mjs create
            --bundle bundle
            --source "$BUILD_SHA"
            --updates candidate-updates
            --output bundle/release.json)
          if [[ -n "$ACTIVE_RELEASE" ]]; then
            create+=(--base active-release/release.json --base-ref "$ACTIVE_RELEASE")
          fi
          "${create[@]}"
          node tools/deploy/release.mjs env \
            --release bundle/release.json \
            --output bundle/images.env

          plan=(node tools/deploy/release.mjs plan --candidate bundle/release.json)
          if [[ -n "$ACTIVE_RELEASE" ]]; then plan+=(--current active-release/release.json); fi
          "${plan[@]}" > release-plan.json
          recreate=$(jq -r '.recreate | join(",")' release-plan.json)

          tar -czf release.tar.gz -C bundle .
          short=${BUILD_SHA:0:7}
          tag="sha-$short-run-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          digest=$(oras push \
            --artifact-type application/vnd.herkules.release.v1 \
            --annotation "org.opencontainers.image.revision=$BUILD_SHA" \
            "$RELEASE_REPOSITORY:$tag" \
            release.tar.gz:application/vnd.herkules.release.bundle.v1+tar+gzip \
            --format go-template --template '{{.digest}}')
          echo "release=$RELEASE_REPOSITORY@$digest" >> "$GITHUB_OUTPUT"
          echo "recreate=$recreate" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_run" ]]; then
            echo "cursor=$CI_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          else
            echo "cursor=${{ steps.active.outputs.cursor }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Skip stale release
        if: steps.active.outputs.stale == 'true'
        run: echo "A newer CI run is already active; skipping this stale release." >> "$GITHUB_STEP_SUMMARY"
      - name: Install SSH key
        if: steps.active.outputs.stale != 'true'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy ~/.ssh/known_hosts
      - name: Deploy immutable release
        if: steps.active.outputs.stale != 'true'
        env:
          ACTIVE_RELEASE: ${{ steps.active.outputs.release }}
          CI_CURSOR: ${{ steps.candidate.outputs.cursor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RECREATE: ${{ steps.candidate.outputs.recreate }}
          RELEASE_REF: ${{ steps.candidate.outputs.release }}
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
        run: |
          expected=${ACTIVE_RELEASE:-none}
          request=$(mktemp)
          jq -n \
            --arg ref "$BUILD_SHA" \
            --arg release "$RELEASE_REF" \
            --arg source "$BUILD_SHA" \
            --argjson cursor "$CI_CURSOR" \
            '{
              ref: $ref,
              task: "deploy:release",
              auto_merge: false,
              required_contexts: [],
              environment: "production",
              production_environment: true,
              description: "Deploy an immutable Herkules OCI release",
              payload: {release: $release, sourceSha: $source, ciCursor: $cursor}
            }' > "$request"
          deployment_id=$(gh api --method POST "repos/$GITHUB_REPOSITORY/deployments" \
            --input "$request" --jq '.id')

          status() {
            state=$1
            description=$2
            jq -n \
              --arg state "$state" \
              --arg description "$description" \
              --arg log_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
              --arg environment_url "https://herkules.dev" \
              '{state: $state, description: $description, log_url: $log_url, environment_url: $environment_url, auto_inactive: false}' \
              > deployment-status.json
            gh api --method POST "repos/$GITHUB_REPOSITORY/deployments/$deployment_id/statuses" \
              --input deployment-status.json >/dev/null
          }
          failed() {
            result=$?
            if [[ "$result" -ne 0 ]]; then status failure "OCI release failed; the previous OCI release was restored when available"; fi
            exit "$result"
          }
          trap failed EXIT
          status in_progress "Applying immutable OCI release"

          archive="release-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.tar.gz"
          ssh -i ~/.ssh/deploy "$TARGET" 'mkdir -p ~/herkules/incoming ~/herkules/import'
          scp -i ~/.ssh/deploy release.tar.gz "$TARGET:~/herkules/incoming/$archive"
          scp -i ~/.ssh/deploy bundle/apply-release.sh "$TARGET:~/herkules/apply-release.sh"
          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/deploy "$TARGET" \
            'docker login ghcr.io -u "${{ github.actor }}" --password-stdin'
          ssh -i ~/.ssh/deploy "$TARGET" \
            "sh ~/herkules/apply-release.sh '$archive' '$RELEASE_REF' '$expected' '$RECREATE'"

          status success "Immutable OCI release is active"
          trap - EXIT
