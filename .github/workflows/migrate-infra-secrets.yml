name: Transfer infrastructure secrets
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  transfer:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    steps:
      - name: Install sealed-box encryption
        run: python3 -m pip install --disable-pip-version-check PyNaCl==1.6.0
      - name: Encrypt for the destination environment
        env:
          DESTINATION_KEY: "TBWF3xfgUa/yHf0tjnVaxfLGW6t+kZzdkY1V1YCMAXU="
          DESTINATION_KEY_ID: "3380204578043523366"
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          TF_STATE_ACCESS_KEY_ID: ${{ secrets.TF_STATE_ACCESS_KEY_ID }}
          TF_STATE_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_SECRET_ACCESS_KEY }}
          TF_VAR_API_TOKEN: ${{ secrets.TF_VAR_API_TOKEN }}
        run: |
          python3 - <<'PYTHON'
          import base64, json, os
          from pathlib import Path
          from nacl.public import PublicKey, SealedBox
          box = SealedBox(PublicKey(base64.b64decode(os.environ['DESTINATION_KEY'])))
          directory = Path('sealed-secrets')
          directory.mkdir()
          names = ["CLOUDFLARE_API_TOKEN", "DEPLOY_HOST", "DEPLOY_KNOWN_HOSTS", "DEPLOY_SSH_KEY", "DEPLOY_USER", "TF_STATE_ACCESS_KEY_ID", "TF_STATE_SECRET_ACCESS_KEY", "TF_VAR_API_TOKEN"]
          for name in names:
              value = os.environ[name]
              if not value:
                  raise SystemExit(f'Missing secret: {name}')
              body = {'key_id': os.environ['DESTINATION_KEY_ID'],
                      'encrypted_value': base64.b64encode(box.encrypt(value.encode())).decode()}
              (directory / f'{name}.json').write_text(json.dumps(body))
          print(f'Encrypted {len(names)} secrets for herkules-infra/production')
          PYTHON
      - uses: actions/upload-artifact@v7
        with:
          name: sealed-infrastructure-secrets
          path: sealed-secrets/*.json
          retention-days: 1
          if-no-files-found: error
